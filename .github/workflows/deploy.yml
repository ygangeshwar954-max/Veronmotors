name: Deploy Veyron Motors to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: artifacts/veyron-motors
        run: |
          npm install --save-dev \
            vite \
            @vitejs/plugin-react \
            @tailwindcss/vite \
            tailwindcss \
            react \
            react-dom \
            @types/react \
            @types/react-dom \
            typescript \
            framer-motion \
            lucide-react \
            wouter \
            lenis \
            swiper \
            clsx \
            tailwind-merge \
            @tanstack/react-query

      - name: Build
        working-directory: artifacts/veyron-motors
        run: npx vite build --config vite.config.github.ts

      - name: Add SPA fallback
        run: cp artifacts/veyron-motors/dist/index.html artifacts/veyron-motors/dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/veyron-motors/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
