name: Deploy Veyron Motors

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use CI package.json
        run: cp artifacts/veyron-motors/package.ci.json artifacts/veyron-motors/package.json

      - name: Install
        run: npm install --legacy-peer-deps
        working-directory: artifacts/veyron-motors

      - name: Build
        run: npx vite build --config vite.config.github.ts
        working-directory: artifacts/veyron-motors

      - name: SPA fallback
        run: cp artifacts/veyron-motors/dist/index.html artifacts/veyron-motors/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/veyron-motors/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
